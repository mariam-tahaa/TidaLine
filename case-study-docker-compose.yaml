name: tidaline-case-study

services:
  kafka:
    image: confluentinc/cp-kafka:7.4.0
    container_name: kafka
    hostname: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,HOST:PLAINTEXT
      KAFKA_LISTENERS: CONTROLLER://0.0.0.0:29093,INTERNAL://0.0.0.0:29092,HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,HOST://localhost:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    healthcheck:
      test: [ "CMD-SHELL", "kafka-topics --bootstrap-server localhost:9092 --list >/dev/null 2>&1" ]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s
    volumes:
      - kafka_kraft_data:/var/lib/kafka/data
    networks:
      - case-study-network

  postgres:
    image: postgres:15
    container_name: postgres
    hostname: postgres
    ports:
      - "7432:5432"
    environment:
      POSTGRES_DB: maritime_logistics
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    command: [ "postgres", "-c", "wal_level=logical", "-c", "max_replication_slots=10", "-c", "max_wal_senders=10" ]
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d maritime_logistics -h localhost" ]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./ingestion/stream/create_earthquakes.sql:/docker-entrypoint-initdb.d/01-earthquakes.sql:ro
    restart: unless-stopped
    networks:
      - case-study-network

  stream_extractor:
    build:
      context: .
      dockerfile: ingestion/stream/Dockerfile
    container_name: stream_extractor
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: maritime_logistics
      DB_USER: postgres
      DB_PASSWORD: postgres
      RETRY_SECONDS: 10
      LOG_LEVEL: INFO
    restart: unless-stopped
    networks:
      - case-study-network

  kafka-connect:
    image: debezium/connect:2.5
    container_name: kafka-connect
    hostname: kafka-connect
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
    ports:
      - "8083:8083"
    environment:
      BOOTSTRAP_SERVERS: kafka:29092
      GROUP_ID: case-study-connect
      CONFIG_STORAGE_TOPIC: case-study-connect-configs
      OFFSET_STORAGE_TOPIC: case-study-connect-offsets
      STATUS_STORAGE_TOPIC: case-study-connect-status
      CONFIG_STORAGE_REPLICATION_FACTOR: 1
      OFFSET_STORAGE_REPLICATION_FACTOR: 1
      STATUS_STORAGE_REPLICATION_FACTOR: 1
      KEY_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      KEY_CONVERTER_SCHEMAS_ENABLE: "false"
      VALUE_CONVERTER_SCHEMAS_ENABLE: "false"
    healthcheck:
      test: [ "CMD-SHELL", "curl --silent --fail http://localhost:8083/connector-plugins >/dev/null" ]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 30s
    restart: unless-stopped
    networks:
      - case-study-network

  sftp:
    image: atmoz/sftp:debian
    container_name: sftp
    hostname: sftp
    ports:
      - "2222:22"
    command: batch:batchpass:1001:1001:data
    volumes:
      - ./ingestion/batch/data:/data
      - ./ingestion/batch/data:/home/batch/data
    restart: unless-stopped
    networks:
      - case-study-network

  namenode:
    image: ysfetman/bdss-hadoop-base:3.4.2
    container_name: namenode
    hostname: namenode
    ports:
      - "9870:9870"
      - "8020:8020"
    volumes:
      - namenode_data:/opt/hadoop/dfs/name
      - ./ingestion/batch/data:/data:ro
      - ./hadoop/conf/core-site.xml:/opt/hadoop/etc/hadoop/core-site.xml:ro
      - ./hadoop/conf/hdfs-site.xml:/opt/hadoop/etc/hadoop/hdfs-site.xml:ro
      - ./hadoop/scripts/namenode.sh:/scripts/namenode.sh:ro
    environment:
      HADOOP_HOME: /opt/hadoop
      HADOOP_CONF_DIR: /opt/hadoop/etc/hadoop
      JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
      PATH: /opt/hadoop/bin:/opt/hadoop/sbin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
    command: [ "/bin/bash", "/scripts/namenode.sh" ]
    networks:
      - case-study-network

  datanode:
    image: ysfetman/bdss-hadoop-base:3.4.2
    container_name: datanode
    hostname: datanode
    user: root 
    ports:
      - "9864:9864"
    volumes:
      - datanode_data:/opt/hadoop/dfs/data
      - ./hadoop/conf/core-site.xml:/opt/hadoop/etc/hadoop/core-site.xml:ro
      - ./hadoop/conf/hdfs-site.xml:/opt/hadoop/etc/hadoop/hdfs-site.xml:ro
      - ./hadoop/scripts/datanode.sh:/scripts/datanode.sh:ro
    environment:
      HADOOP_HOME: /opt/hadoop
      HADOOP_CONF_DIR: /opt/hadoop/etc/hadoop
      JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
      PATH: /opt/hadoop/bin:/opt/hadoop/sbin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
    command: [ "/bin/bash", "/scripts/datanode.sh" ]
    depends_on:
      - namenode
    networks:
      - case-study-network

  spark:
    image: apache/spark:3.5.3
    container_name: spark
    hostname: spark
    user: root
    depends_on:
      kafka:
        condition: service_healthy
      namenode:
        condition: service_started
      hive-metastore:
        condition: service_started
    environment:
      SPARK_HOME: /opt/spark
    volumes:
      - ./spark/jobs:/opt/spark-apps
      - ./spark/jars:/opt/spark-jars
      - ./hadoop/conf/core-site.xml:/opt/spark/conf/core-site.xml:ro
      - ./hadoop/conf/hdfs-site.xml:/opt/spark/conf/hdfs-site.xml:ro
      - ./hive/conf/hive-site.xml:/opt/spark/conf/hive-site.xml:ro
    ports:
      - "8081:8080"
      - "7077:7077"
    command: [ "tail", "-f", "/dev/null" ]
    networks:
      - case-study-network


  hive-metastore-db:
    image: postgres:15
    container_name: hive-metastore-db
    hostname: hive-metastore-db
    environment:
      POSTGRES_DB: metastore_db
      POSTGRES_USER: hive
      POSTGRES_PASSWORD: hive
    volumes:
      - hive_metastore_db_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U hive -d metastore_db -h localhost" ]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - case-study-network

  hive-metastore:
    image: apache/hive:3.1.3
    container_name: hive-metastore
    hostname: hive-metastore
    depends_on:
      hive-metastore-db:
        condition: service_healthy
      namenode:
        condition: service_started
    environment:
      IS_RESUME: "true"
      SERVICE_NAME: metastore
      DB_DRIVER: postgres
      SERVICE_OPTS: >-
        -Djavax.jdo.option.ConnectionURL=jdbc:postgresql://hive-metastore-db:5432/metastore_db
        -Djavax.jdo.option.ConnectionDriverName=org.postgresql.Driver
        -Djavax.jdo.option.ConnectionUserName=hive
        -Djavax.jdo.option.ConnectionPassword=hive
    ports:
      - "9083:9083"
    volumes:
      - ./hadoop/conf/core-site.xml:/opt/hadoop/etc/hadoop/core-site.xml:ro
      - ./hadoop/conf/hdfs-site.xml:/opt/hadoop/etc/hadoop/hdfs-site.xml:ro
      - ./hive/conf/hive-site.xml:/opt/hive/conf/hive-site.xml:ro
      - ./hive/lib/postgresql-42.7.3.jar:/opt/hive/lib/postgresql-42.7.3.jar:ro
    networks:
      - case-study-network




  airflow-db:
    image: postgres:15
    container_name: airflow-db
    hostname: airflow-db
    environment:
      POSTGRES_DB: airflow
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
    volumes:
      - airflow_db_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U airflow -d airflow -h localhost" ]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - case-study-network

  airflow-init:
    build:
      context: ./airflow
      dockerfile: Dockerfile
      
    container_name: airflow-init
    depends_on:
      airflow-db:
        condition: service_healthy
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-db:5432/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - ./airflow/plugins:/opt/airflow/plugins
      - ./airflow/init.sh:/init.sh:ro
    entrypoint: /bin/bash
    command: ["/init.sh"]
    networks:
      - case-study-network

  airflow-webserver:
    build:
      context: ./airflow
      dockerfile: Dockerfile

    container_name: airflow-webserver
    hostname: airflow-webserver
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-db:5432/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__WEBSERVER__SECRET_KEY: change-me
    ports:
      - "8090:8080"
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - ./airflow/plugins:/opt/airflow/plugins
      - ./hadoop/conf/core-site.xml:/opt/airflow/conf/core-site.xml:ro
      - ./hadoop/conf/hdfs-site.xml:/opt/airflow/conf/hdfs-site.xml:ro
      - /var/run/docker.sock:/var/run/docker.sock

    command: webserver
    restart: unless-stopped
    networks:
      - case-study-network

  airflow-scheduler:
    build:
      context: ./airflow
      dockerfile: Dockerfile

    container_name: airflow-scheduler
    hostname: airflow-scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-db:5432/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - ./airflow/plugins:/opt/airflow/plugins
      - ./hadoop/conf/core-site.xml:/opt/airflow/conf/core-site.xml:ro
      - ./hadoop/conf/hdfs-site.xml:/opt/airflow/conf/hdfs-site.xml:ro
      - /var/run/docker.sock:/var/run/docker.sock

    command: scheduler
    restart: unless-stopped
    networks:
      - case-study-network


networks:
  case-study-network:
    name: tidaline-case-study-network
    driver: bridge

volumes:
  kafka_kraft_data:
  postgres_data:
  namenode_data:
  datanode_data:
  hive_metastore_db_data:
  airflow_db_data: